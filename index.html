<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal OS - Operação BadBox</title>
    <style>
        body {
            background-color: #050505; color: #33ff33; font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
            overflow-x: hidden; transition: 0.3s;
        }
        body.matrix-mode {
            text-shadow: 0 0 5px #33ff33, 0 0 10px #33ff33;
        }
        body.panic-mode {
            background-color: #220000; color: #ff3333;
        }
        body.game-over {
            background-color: #0000aa; color: #ffffff; text-align: center; justify-content: center;
        }
        body::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; pointer-events: none; z-index: 10;
        }
        #output { flex-grow: 1; overflow-y: auto; white-space: pre-wrap; padding-bottom: 20px; font-size: 15px; line-height: 1.5; z-index: 20;}
        .input-line { display: flex; align-items: center; font-size: 16px; margin-top: 10px; border-top: 1px solid currentColor; padding-top: 10px; z-index: 20;}
        .prompt { margin-right: 10px; font-weight: bold; color: currentColor; white-space: nowrap; }
        input[type="text"], input[type="password"] {
            background: transparent; border: none; color: currentColor; font-family: 'Courier New', Courier, monospace;
            font-size: 16px; width: 100%; outline: none; text-transform: lowercase; text-shadow: inherit;
        }
        .sys { color: #00ccff; } .err { color: #ff3333; font-weight: bold; } .warn { color: #ffff00; } .suc { color: #00ff00; font-weight: bold; } .destaque { color: #ff00ff; }
        
        #timer {
            display: none; position: fixed; top: 10px; right: 20px; font-size: 30px; font-weight: bold; color: #ff3333;
            text-shadow: 0 0 10px #ff0000; z-index: 30; animation: piscar 0.5s infinite alternate;
        }
        @keyframes piscar { from { opacity: 1; } to { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="timer">01:00</div>
    <div id="output"></div>
    <div class="input-line" id="input-container">
        <span id="prompt-text" class="prompt">agente@base:~$</span>
        <input type="text" id="cmdInput" autocomplete="off" spellcheck="false" autofocus>
    </div>

    <script>
        const output = document.getElementById('output');
        const input = document.getElementById('cmdInput');
        const timerDiv = document.getElementById('timer');
        
        let estado = {
            aguardandoSenhaSudo: false,
            timerAtivo: null,
            tempoRestante: 60,
            gameOver: false
        };

        const bootText = `[ AGÊNCIA DE CIBERSEGURANÇA - TERMINAL DE OPERAÇÕES ]
SISTEMA PRONTO.
Ameaça detectada na rede local. A maleta de ferramentas foi carregada.
Acesse a maleta e inicie o protocolo de contenção.
--------------------------------------------------\n`;

        setTimeout(() => { writeHTML(bootText); }, 500);

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !estado.gameOver) {
                const cmdString = input.value.trim().toLowerCase();
                input.value = '';
                if(cmdString) {
                    if (estado.aguardandoSenhaSudo) {
                        writeLine(`[SUDO] Senha: *******`, "warn");
                        processarSenhaSudo(cmdString);
                    } else {
                        writeLine(`agente@base:~$ ${cmdString}`, "");
                        processarComando(cmdString.split(" "));
                    }
                }
            }
        });

        function writeHTML(html) { output.innerHTML += html + "\n"; output.scrollTop = output.scrollHeight; }
        function writeLine(text, type = "") {
            let cls = type ? `class='${type}'` : "";
            output.innerHTML += `<span ${cls}>${text}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }

        function iniciarTimerPanico() {
            document.body.classList.add('panic-mode');
            timerDiv.style.display = 'block';
            estado.aguardandoSenhaSudo = true;
            document.getElementById('prompt-text').textContent = "SENHA DE OVERRIDE (7 caracteres): ";
            document.getElementById('cmdInput').type = "password";

            estado.timerAtivo = setInterval(() => {
                estado.tempoRestante--;
                let segs = estado.tempoRestante;
                timerDiv.textContent = `00:${segs < 10 ? '0' : ''}${segs}`;
                
                if (estado.tempoRestante <= 0) {
                    clearInterval(estado.timerAtivo);
                    triggerGameOver();
                }
            }, 1000);
        }

        function triggerGameOver() {
            estado.gameOver = true;
            document.body.className = 'game-over';
            document.getElementById('input-container').style.display = 'none';
            output.innerHTML = `
<br><br><br><br>
<h1 style="color: white; font-size: 40px; text-shadow: none;">:( FATAL ERROR</h1>
<h3>O MALWARE DELETOU SEU SISTEMA. A REDE FOI COMPROMETIDA.</h3>
<p>O aparelho continuará integrando a Botnet.</p>
<p>Pressione F5 para reiniciar o terminal e tentar novamente.</p>
`;
        }

        function processarSenhaSudo(senha) {
            if (senha === "d3ada55" || senha === "d3a_da55") {
                clearInterval(estado.timerAtivo);
                timerDiv.style.display = 'none';
                document.body.classList.remove('panic-mode');
                
                writeLine("\n> OVERRIDE ACEITO.", "suc");
                setTimeout(() => {
                    writeLine("> EXECUTANDO DELEÇÃO FÍSICA DO MALWARE...", "sys");
                    writeLine("[===================================>] 100%", "suc");
                    writeLine("MALWARE 'POPANET' DESTRUÍDO. REDE ISOLADA.", "suc");
                    writeLine("\n🏆 MISSÃO CUMPRIDA! 🏆", "warn");
                    writeLine("A Botnet perdeu mais um nó. A casa está segura.");
                    writeLine("Parabéns, Agente. Mostre esta tela ao seu professor.", "sys");
                    input.disabled = true;
                    document.getElementById('prompt-text').style.display = 'none';
                }, 1500);
            } else {
                writeLine("SENHA INCORRETA. ACESSO NEGADO.", "err");
            }
        }

        function processarComando(args) {
            const cmd = args[0];
            const p1 = args[1] || "";
            const p2 = args[2] || "";
            const p3 = args[3] || "";

            // EASTER EGGS
            if (cmd === "matrix") { 
                document.body.classList.toggle('matrix-mode'); 
                writeLine("Wake up, Neo...", "suc"); return; 
            }
            if (cmd === "whoami") { writeLine("Você é a única linha de defesa desta rede. Foque na missão.", "sys"); return; }
            if (cmd === "hack") { writeLine("Acesso negado. Nós somos os mocinhos, lembra?", "warn"); return; }
            if (cmd === "desistir") { writeLine("Comando não reconhecido por agentes de elite.", "err"); return; }
            
            if (cmd === "clear") { output.innerHTML = ""; return; }
            if (cmd === "help") { writeLine("ERRO: O sistema não fornece dicas. Consulte os arquivos locais.", "err"); return; }

            // COMANDOS REAIS
            if (cmd === "ls") {
                writeLine("- maleta_ferramentas.txt", "sys");
                return;
            }
            
            if (cmd === "cat") {
                if (p1.includes("maleta")) {
                    writeHTML(`<br><span class="warn">--- GUIA DE COMANDOS TÁTICOS ---</span>
<span class="sys">ipconfig</span>       : Exibe as configurações do seu adaptador de rede.
<span class="sys">arp</span>            : Exibe a tabela de endereços físicos (MAC) no Wi-Fi.
<span class="sys">ping [ip]</span>      : Envia pacotes ICMP para medir latência de um IP.
<span class="sys">traceroute [ip]</span>: Mapeia os saltos de rede de um IP para a internet.
<span class="sys">dig [ip]</span>       : Intercepta requisições de DNS do alvo.
<span class="sys">decode [hash]</span>  : Desofusca strings no formato Base64.
<span class="sys">sudo rm [nome] [ip]</span> : Força a exclusão de um arquivo em um nó remoto.
<span class="warn">-----------------------------------</span>`);
                } else {
                    writeLine("cat: arquivo não encontrado.", "err");
                }
                return;
            }

            if (cmd === "ipconfig") {
                writeLine("Adaptador de Rede Sem Fio WiFi_Robert:", "sys");
                writeLine("   Endereço IPv4. . . . . . . .  : 192.168.1.10");
                writeLine("   Máscara de Sub-rede. . . . .  : 255.255.255.0");
                writeLine("   Gateway Padrão . . . . . . .  : 192.168.1.1");
                return;
            }

            if (cmd === "arp") {
                writeLine("Tabela ARP (Cache Local):", "sys");
                writeLine("IP                MAC Address       Tipo");
                writeLine("192.168.1.1       00:1A:2B:3C:4D    Gateway");
                writeLine("192.168.1.55      A1:B2:C3:D4:E5    Mobile");
                writeLine("192.168.1.115     FF:FF:FF:FF:FF    Unknown_Box");
                return;
            }

            if (cmd === "ping") {
                if (p1 === "192.168.1.115") {
                    writeLine("Disparando 192.168.1.115 com 32 bytes de dados:", "sys");
                    writeLine("Resposta de 192.168.1.115: tempo=890ms TTL=64");
                    writeLine("Resposta de 192.168.1.115: tempo=910ms TTL=64");
                    writeLine("Estatísticas: 0% de perda. Latência Crítica.", "err");
                } else if (p1) {
                    writeLine(`Resposta de ${p1}: tempo=2ms TTL=64`);
                } else {
                    writeLine("ping: uso incorreto. Falta IP.", "err");
                }
                return;
            }

            if (cmd === "traceroute") {
                if (p1 === "192.168.1.115") {
                    writeLine("Rastreando rotas outbound de 192.168.1.115...", "sys");
                    writeLine(" 1  192.168.1.1 (Gateway Local)  1ms");
                    writeLine(" 2  10.0.0.1 (ISP ISP_Node)      15ms");
                    writeLine(" 3  203.0.113.88 (Tencent AS)    240ms");
                } else {
                    writeLine("traceroute: alvo não especificado.", "err");
                }
                return;
            }

            if (cmd === "dig") {
                if (p1 === "192.168.1.115") {
                    writeLine("Interceptando DNS de 192.168.1.115...", "sys");
                    setTimeout(() => {
                        writeLine("QUERY DETECTADA:");
                        writeLine(";; QUESTION SECTION:");
                        writeLine(";c2-server.<span class='err'>cG9wYW5ldA==</span>.net. IN A");
                    }, 1000);
                } else {
                    writeLine("dig: alvo não especificado.", "err");
                }
                return;
            }

            if (cmd === "decode") {
                if (p1 === "cG9wYW5ldA==" || p1 === "cg9wyw5ldA==" || p1 === "cg9wyw5lda==") {
                    // Ignora case sensitive para facilitar a digitação no celular
                    writeLine("Iniciando decodificação Base64...", "sys");
                    writeLine("RESULTADO: popanet", "suc");
                } else if (p1) {
                    writeLine("decode: string inválida ou não suportada.", "err");
                } else {
                    writeLine("decode: sintaxe incorreta. Falta hash.", "err");
                }
                return;
            }

            if (cmd === "sudo") {
                if (p1 === "rm" && (p2 === "cg9wyw5lda==" || p2 === "cg9wyw5ldA==" || p2 === "cG9wYW5ldA==")) {
                    writeLine("sudo rm: Arquivo não encontrado. O sistema requer a string decodificada (plain text).", "err");
                    return;
                }
                if (p1 === "rm" && p2 === "popanet" && p3 === "192.168.1.115") {
                    writeLine("ATENÇÃO: INICIANDO PROTOCOLO DE EXCLUSÃO.", "warn");
                    setTimeout(() => {
                        writeLine("[!] CONTRA-MEDIDA DETECTADA.", "err");
                        writeLine("[!] O MALWARE INICIOU O FORMATAMENTO DO SEU DISCO LOCAL.", "err");
                        writeLine("[!] INSIRA O CÓDIGO DE OVERRIDE IMEDIATAMENTE.", "err");
                        iniciarTimerPanico();
                    }, 1000);
                } else {
                    writeLine("sudo: uso incorreto. Verifique a sintaxe tática.", "err");
                }
                return;
            }

            if (cmd === "rm") {
                writeLine("rm: permissão negada. Operações de rede exigem 'sudo'.", "err");
                return;
            }

            writeLine(`bash: ${cmd}: comando não encontrado`, "err");
        }
    </script>
</body>
</html>
