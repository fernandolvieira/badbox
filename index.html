<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Invasão - BadBox</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        /* Efeito de tela de tubo antiga (CRT) */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            padding-bottom: 20px;
            text-shadow: 0 0 5px #00ff00;
            font-size: 14px;
        }
        .input-line {
            display: flex;
            align-items: center;
            font-size: 16px;
            margin-top: 10px;
            z-index: 3;
        }
        .prompt { margin-right: 10px; font-weight: bold; }
        input[type="text"] {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            width: 100%;
            outline: none;
            text-shadow: 0 0 5px #00ff00;
            text-transform: lowercase;
        }
        /* Cores especiais para o texto */
        .system { color: #00ccff; }
        .error { color: #ff3333; text-shadow: 0 0 5px #ff3333; }
        .warning { color: #ffff00; text-shadow: 0 0 5px #ffff00; }
        .success { color: #00ff00; font-weight: bold; }
        
        #timer {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
            color: #ff3333;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff3333;
            z-index: 10;
            animation: piscar 1s infinite;
        }
        @keyframes piscar { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="timer">02:30</div>
    <div id="output"></div>
    <div class="input-line">
        <span class="prompt">guest@rede-robert:~$</span>
        <input type="text" id="cmdInput" autocomplete="off" spellcheck="false" autofocus>
    </div>

    <script>
        const output = document.getElementById('output');
        const input = document.getElementById('cmdInput');
        const timerDiv = document.getElementById('timer');
        
        // Estado do jogo
        let faseAtual = 1;
        let timerInterval;
        let tempoRestante = 150; // 2 minutos e meio

        // Mensagem inicial
        const bootText = `
[ SISTEMA DE DEFESA CIBERNÉTICA INICIADO ]
Conectado à rede residencial: ROBERT_WIFI
Status: AMEAÇA DETECTADA. Tráfego anômalo na madrugada.
Missão: Encontre a origem, isole o aparelho e desative a botnet.
--------------------------------------------------
DICA: Você é um hacker agora. Digite <span class="warning">help</span> e pressione ENTER para ver os comandos disponíveis.
        `;

        function writeHTML(html) {
            output.innerHTML += html + "<br>";
            output.scrollTop = output.scrollHeight;
        }

        function writeLine(text, type = "") {
            let className = "";
            if (type === "sys") className = "system";
            if (type === "err") className = "error";
            if (type === "warn") className = "warning";
            if (type === "suc") className = "success";
            
            output.innerHTML += `<span class="${className}">${text}</span><br>`;
            output.scrollTop = output.scrollHeight;
        }

        // Inicializa a tela
        setTimeout(() => writeHTML(bootText), 500);

        // Captura o ENTER
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const cmd = input.value.trim().toLowerCase();
                input.value = '';
                writeLine(`guest@rede-robert:~$ ${cmd}`, "");
                processCommand(cmd);
            }
        });

        // Motor de Processamento de Comandos
        function processCommand(cmd) {
            if (cmd === "") return;

            // Comandos Globais
            if (cmd === "clear") { output.innerHTML = ""; return; }
            
            if (cmd === "help") {
                writeLine("Comandos disponíveis:", "sys");
                writeLine("  help     - Mostra esta tela");
                writeLine("  clear    - Limpa o terminal");
                if (faseAtual === 1) writeLine("  scan     - Escaneia a rede em busca de IPs e tráfego");
                if (faseAtual >= 2) writeLine("  analyze [IP] - Analisa vulnerabilidades de um IP específico");
                if (faseAtual >= 3) writeLine("  remove [nome] - Remove um software malicioso");
                if (faseAtual === 4) writeLine("  answer [texto] - Envia uma resposta ao sistema de segurança");
                if (faseAtual === 5) writeLine("  abort [código] - Envia código de emergência para parar DDoS");
                return;
            }

            // FASE 1: Escanear a rede
            if (faseAtual === 1) {
                if (cmd === "scan") {
                    writeLine("Escaneando rede local (192.168.1.x)...", "sys");
                    setTimeout(() => {
                        writeLine("IP: 192.168.1.5  | Disp: Smartphone Ashley | Tráfego: Baixo");
                        writeLine("IP: 192.168.1.10 | Disp: TV Box SuperBox   | Tráfego: EXTREMO (Anomalia)");
                        writeLine("IP: 192.168.1.12 | Disp: Notebook Robert   | Tráfego: Normal");
                        writeLine("-> Aparelho suspeito identificado. Use o comando 'analyze' no IP dele.", "warn");
                        faseAtual = 2;
                    }, 1500);
                } else {
                    writeLine("Comando não reconhecido ou bloqueado. Tente 'help'.", "err");
                }
                return;
            }

            // FASE 2: Analisar o IP suspeito
            if (faseAtual === 2) {
                if (cmd === "analyze 192.168.1.10") {
                    writeLine("Conectando ao IP 192.168.1.10...", "sys");
                    setTimeout(() => {
                        writeLine("[!] ACESSO ROOT IDENTIFICADO SEM SENHA.", "err");
                        writeLine("Vulnerabilidade Encontrada: Porta ADB exposta.");
                        writeLine("Lendo sistema de arquivos da loja pirata...");
                        writeLine("[!] SOFTWARE DE ACESSO REMOTO ENCONTRADO: teamviewer");
                        writeLine("-> Ação necessária: Remova o software para cortar o acesso do hacker.", "warn");
                        faseAtual = 3;
                    }, 1500);
                } else if (cmd.startsWith("analyze")) {
                    writeLine("Erro: IP inválido ou não malicioso.", "err");
                } else if (cmd === "scan") {
                    writeLine("A rede já foi escaneada. Foque no IP suspeito.", "sys");
                } else {
                    writeLine("Comando não reconhecido. Tente 'help'.", "err");
                }
                return;
            }

            // FASE 3: Remover o TeamViewer e o Popanet
            if (faseAtual === 3) {
                if (cmd === "remove teamviewer") {
                    writeLine("Tentando desinstalar teamviewer...", "sys");
                    setTimeout(() => {
                        writeLine("SUCESSO: teamviewer removido.", "suc");
                        writeLine("ERRO CRÍTICO: Um malware raiz chamado 'popanet' está bloqueando a limpeza total.", "err");
                        writeLine("Para desativar o popanet, prove que você conhece sua função. Qual é o principal objetivo dos hackers ao usar a casa do Robert?", "sys");
                        writeLine("A) Roubar senhas do banco");
                        writeLine("B) Usar a internet dele como Proxy Residencial");
                        writeLine("C) Espionar pela câmera da TV");
                        writeLine("-> Use o comando 'answer [letra]' para responder (Ex: answer a).", "warn");
                        faseAtual = 4;
                    }, 1000);
                } else if (cmd.startsWith("remove")) {
                    writeLine("Software não encontrado no diretório.", "err");
                } else {
                    writeLine("Comando não reconhecido. Use 'help' se estiver perdido.", "err");
                }
                return;
            }

            // FASE 4: O Teste de Conhecimento (Proxy Residencial)
            if (faseAtual === 4) {
                if (cmd === "answer b" || cmd === "answer proxy residencial") {
                    writeLine("Autenticação aceita. O verdadeiro produto era a casa dele.", "suc");
                    writeLine("Desativando Popanet...", "sys");
                    setTimeout(() => {
                        writeLine("ALERTA DE SEGURANÇA MÁXIMA!", "err");
                        writeLine("O servidor central na China detectou sua invasão.");
                        writeLine("A Botnet 'exjuruin Wolf' foi ativada. Um ataque DDoS massivo começará em breve.", "err");
                        writeLine("-> INICIANDO CONTAGEM REGRESSIVA...", "warn");
                        iniciarTimer();
                        writeLine("Para sobrecarregar e abortar o servidor, insira a capacidade máxima do maior ataque já registrado (em TB/s).", "sys");
                        writeLine("-> Use o comando 'abort [numero]' (Ex: abort 10.5). Rápido!", "warn");
                        faseAtual = 5;
                    }, 1500);
                } else if (cmd.startsWith("answer")) {
                    writeLine("Resposta incorreta. O popanet mascara conexões. Tente novamente.", "err");
                } else {
                    writeLine("Apenas o comando 'answer' é aceito agora.", "err");
                }
                return;
            }

            // FASE 5: O Código Final sob Pressão
            if (faseAtual === 5) {
                if (cmd === "abort 31.4" || cmd === "abort 31,4") {
                    clearInterval(timerInterval);
                    timerDiv.style.display = 'none';
                    writeLine("CÓDIGO ACEITO. ENVIANDO PACOTES DE CANCELAMENTO...", "suc");
                    setTimeout(() => {
                        writeLine("--------------------------------------------------", "suc");
                        writeLine("[ ATAQUE DDoS ABORTADO ]", "suc");
                        writeLine("Rede isolada. Botnet neutralizada.", "suc");
                        writeLine("Parabéns, você salvou a infraestrutura global. A pirataria não valia o preço.", "suc");
                        writeLine("--------------------------------------------------", "suc");
                        writeLine("Mostre esta tela ao seu professor para provar que concluiu o desafio!", "warn");
                        document.querySelector('.prompt').style.display = 'none';
                        input.style.display = 'none';
                    }, 2000);
                } else if (cmd.startsWith("abort")) {
                    writeLine("CÓDIGO INVÁLIDO. Lembre-se do vídeo: o maior ataque relatado (31.4).", "err");
                } else {
                    writeLine("O TEMPO ESTÁ ACABANDO! Use o comando 'abort [numero]'", "err");
                }
                return;
            }
            
            writeLine("Comando não reconhecido. Digite 'help'.", "err");
        }

        // Função do Timer
        function iniciarTimer() {
            timerDiv.style.display = 'block';
            timerInterval = setInterval(() => {
                tempoRestante--;
                let minutos = Math.floor(tempoRestante / 60);
                let segundos = tempoRestante % 60;
                timerDiv.textContent = `0${minutos}:${segundos < 10 ? '0' : ''}${segundos}`;
                
                if (tempoRestante <= 0) {
                    clearInterval(timerInterval);
                    input.disabled = true;
                    writeLine("TEMPO ESGOTADO. O ATAQUE DDoS FOI LANÇADO. VOCÊ FALHOU.", "err");
                    timerDiv.textContent = "GAME OVER";
                }
            }, 1000);
        }
    </script>
</body>
</html>
