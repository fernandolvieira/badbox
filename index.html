<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal OS - Operação BadBox</title>
    <style>
        body {
            background-color: #050505; color: #33ff33; font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
            overflow-x: hidden; transition: 0.3s;
        }
        body.matrix-mode { text-shadow: 0 0 5px #33ff33, 0 0 10px #33ff33; }
        body.panic-mode { background-color: #220000; color: #ff3333; }
        body.game-over { background-color: #0000aa; color: #ffffff; text-align: center; justify-content: center; }
        body::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; pointer-events: none; z-index: 10;
        }
        #output { flex-grow: 1; overflow-y: auto; white-space: pre-wrap; padding-bottom: 20px; font-size: 15px; line-height: 1.5; z-index: 20;}
        .input-line { display: flex; align-items: center; font-size: 16px; margin-top: 10px; border-top: 1px solid currentColor; padding-top: 10px; z-index: 20;}
        .prompt { margin-right: 10px; font-weight: bold; color: currentColor; white-space: nowrap; }
        input[type="text"], input[type="password"] {
            background: transparent; border: none; color: currentColor; font-family: 'Courier New', Courier, monospace;
            font-size: 16px; width: 100%; outline: none; text-transform: lowercase; text-shadow: inherit;
        }
        .sys { color: #00ccff; } .err { color: #ff3333; font-weight: bold; } .warn { color: #ffff00; } .suc { color: #00ff00; font-weight: bold; } .destaque { color: #ff00ff; }
        .hint { color: #888888; font-style: italic; margin-top: 5px; display: block; border-left: 2px solid #555; padding-left: 10px;}
        #timer {
            display: none; position: fixed; top: 10px; right: 20px; font-size: 30px; font-weight: bold; color: #ff3333;
            text-shadow: 0 0 10px #ff0000; z-index: 30; animation: piscar 0.5s infinite alternate;
        }
        @keyframes piscar { from { opacity: 1; } to { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="timer">03:00</div>
    <div id="output"></div>
    <div class="input-line" id="input-container">
        <span id="prompt-text" class="prompt">agente@base:~$</span>
        <input type="text" id="cmdInput" autocomplete="off" spellcheck="false" autofocus>
    </div>

    <script>
        // GERADOR DE IPs ALEATÓRIOS POR SESSÃO
        const redeID = Math.floor(Math.random() * 200) + 1; // Ex: 192.168.X
        const alvoFinal = Math.floor(Math.random() * 150) + 100; // Ex: 100 a 250
        const ipGateway = `192.168.${redeID}.1`;
        const ipPlayer = `192.168.${redeID}.10`;
        const ipAlvo = `192.168.${redeID}.${alvoFinal}`;

        const output = document.getElementById('output');
        const input = document.getElementById('cmdInput');
        const timerDiv = document.getElementById('timer');
        
        // STATUS DE PROGRESSÃO (Travas)
        let estado = {
            maletaLida: false,
            redeMapeada: false,
            arpVisto: false,
            alvoPingado: false,
            dnsInterceptado: false,
            hashDecodificado: false,
            aguardandoSenhaSudo: false,
            timerAtivo: null,
            tempoRestante: 180, // 3 MINUTOS
            gameOver: false
        };

        const bootText = `[ AGÊNCIA DE CIBERSEGURANÇA - TERMINAL DE OPERAÇÕES ]
SISTEMA PRONTO.
Ameaça detectada na rede local. Uma maleta de ferramentas foi carregada na sua pasta.
--------------------------------------------------
<span class="hint">> IA_TÁTICA: Analistas experientes não agem às cegas. Descubra o que há no seu diretório atual para encontrar o manual e leia seu conteúdo.</span>
\n`;

        setTimeout(() => { writeHTML(bootText); }, 500);

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !estado.gameOver) {
                const cmdString = input.value.trim().toLowerCase();
                input.value = '';
                if(cmdString) {
                    if (estado.aguardandoSenhaSudo) {
                        writeLine(`[SUDO] Senha: *******`, "warn");
                        processarSenhaSudo(cmdString);
                    } else {
                        writeLine(`agente@base:~$ ${cmdString}`, "");
                        processarComando(cmdString.split(" "));
                    }
                }
            }
        });

        function writeHTML(html) { output.innerHTML += html + "\n"; output.scrollTop = output.scrollHeight; }
        function writeLine(text, type = "") {
            let cls = type ? `class='${type}'` : "";
            output.innerHTML += `<span ${cls}>${text}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }

        function iniciarTimerPanico() {
            document.body.classList.add('panic-mode');
            timerDiv.style.display = 'block';
            estado.aguardandoSenhaSudo = true;
            document.getElementById('prompt-text').textContent = "SENHA DE OVERRIDE (7 caracteres): ";
            document.getElementById('cmdInput').type = "password";

            estado.timerAtivo = setInterval(() => {
                estado.tempoRestante--;
                
                // Formatação correta para minutos e segundos
                let mins = Math.floor(estado.tempoRestante / 60);
                let segs = estado.tempoRestante % 60;
                timerDiv.textContent = `0${mins}:${segs < 10 ? '0' : ''}${segs}`;
                
                if (estado.tempoRestante <= 0) {
                    clearInterval(estado.timerAtivo);
                    triggerGameOver();
                }
            }, 1000);
        }

        function triggerGameOver() {
            estado.gameOver = true;
            document.body.className = 'game-over';
            document.getElementById('input-container').style.display = 'none';
            output.innerHTML = `
<br><br><br><br>
<h1 style="color: white; font-size: 40px; text-shadow: none;">:( FATAL ERROR</h1>
<h3>O MALWARE DELETOU SEU SISTEMA. A REDE FOI COMPROMETIDA.</h3>
<p>O aparelho continuará integrando a Botnet.</p>
<p>Pressione F5 para reiniciar o terminal e tentar novamente.</p>
`;
        }

        function processarSenhaSudo(senha) {
            if (senha === "d3ada55" || senha === "d3a_da55") {
                clearInterval(estado.timerAtivo);
                timerDiv.style.display = 'none';
                document.body.classList.remove('panic-mode');
                
                writeLine("\n> OVERRIDE ACEITO.", "suc");
                setTimeout(() => {
                    writeLine("> EXECUTANDO DELEÇÃO FÍSICA DO MALWARE...", "sys");
                    writeLine("[===================================>] 100%", "suc");
                    writeLine("MALWARE 'POPANET' DESTRUÍDO. REDE ISOLADA.", "suc");
                    writeLine("\n🏆 MISSÃO CUMPRIDA! 🏆", "warn");
                    writeLine("A Botnet perdeu mais um nó. A casa está segura.");
                    writeLine("Parabéns, Agente. Mostre esta tela ao seu professor.", "sys");
                    input.disabled = true;
                    document.getElementById('prompt-text').style.display = 'none';
                }, 1500);
            } else {
                writeLine("SENHA INCORRETA. ACESSO NEGADO. (Pense em quem descobriu o esquema nos eventos).", "err");
            }
        }

        function processarComando(args) {
            const cmd = args[0];
            const p1 = args[1] || "";
            const p2 = args[2] || "";
            const p3 = args[3] || "";

            // EASTER EGGS
            if (cmd === "matrix") { document.body.classList.toggle('matrix-mode'); writeLine("Wake up, Neo...", "suc"); return; }
            if (cmd === "whoami") { writeLine("Você é a única linha de defesa desta rede. Foque na missão.", "sys"); return; }
            if (cmd === "hack") { writeLine("Acesso negado. Nós somos os mocinhos, lembra?", "warn"); return; }
            if (cmd === "desistir") { writeLine("Comando não reconhecido por agentes de elite.", "err"); return; }
            
            if (cmd === "clear") { output.innerHTML = ""; return; }
            if (cmd === "help") { writeLine("ERRO: O sistema não fornece dicas diretas. Leia os arquivos e os sussurros da IA Tática.", "err"); return; }

            // LEITURA DO MANUAL
            if (cmd === "ls") { writeLine("- maleta_ferramentas.txt", "sys"); return; }
            
            if (cmd === "cat") {
                if (p1.includes("maleta")) {
                    estado.maletaLida = true;
                    writeHTML(`<br><span class="warn">--- GUIA DE COMANDOS TÁTICOS ---</span>
<span class="sys">ipconfig</span>       : Exibe as configurações do seu adaptador de rede.
<span class="sys">arp</span>            : Exibe a tabela de endereços físicos (MAC) no Wi-Fi.
<span class="sys">ping [ip]</span>      : Envia pacotes ICMP para medir latência de um IP.
<span class="sys">traceroute [ip]</span>: Mapeia os saltos de rede de um IP para a internet.
<span class="sys">dig [ip]</span>       : Intercepta requisições de DNS do alvo.
<span class="sys">decode [hash]</span>  : Desofusca strings no formato Base64.
<span class="sys">sudo rm [nome] [ip]</span> : Força a exclusão de um arquivo em um nó remoto.
<span class="warn">-----------------------------------</span>
<span class="hint">> IA_TÁTICA: Ferramentas carregadas. Antes de buscar intrusos, identifique o seu próprio endereço na rede para se localizar.</span>`);
                } else {
                    writeLine("cat: arquivo não encontrado.", "err");
                }
                return;
            }

            // TRAVA 1: Tem que ler a maleta
            if (!estado.maletaLida) {
                writeLine("OPERAÇÃO RECUSADA: Abra e leia sua maleta de ferramentas primeiro.", "err");
                return;
            }

            // COMANDO 1: IPCONFIG
            if (cmd === "ipconfig") {
                writeLine("Adaptador de Rede Sem Fio WiFi_Robert:", "sys");
                writeLine(`   Endereço IPv4. . . . . . . .  : ${ipPlayer}`);
                writeLine("   Máscara de Sub-rede. . . . .  : 255.255.255.0");
                writeLine(`   Gateway Padrão . . . . . . .  : ${ipGateway}`);
                writeLine("> IA_TÁTICA: Espaço físico reconhecido. Agora, faça um levantamento (ARP) para descobrir quem mais está compartilhando este mesmo Wi-Fi.", "hint");
                estado.redeMapeada = true;
                return;
            }

            // TRAVA 2: Tem que rodar IPCONFIG antes do ARP
            if (cmd === "arp") {
                if (!estado.redeMapeada) {
                    writeLine("ERRO: O cache ARP está inacessível. Execute o mapeamento de sua própria rede primeiro.", "err");
                    return;
                }
                writeLine("Tabela ARP (Cache Local):", "sys");
                writeLine("IP                MAC Address       Tipo");
                writeLine(`${ipGateway.padEnd(17)} 00:1A:2B:3C:4D    Gateway`);
                writeLine(`${ipAlvo.padEnd(17)} FF:FF:FF:FF:FF    Unknown_Box`);
                writeLine("> IA_TÁTICA: O dispositivo 'Unknown' levanta suspeitas. Avalie o estado dele disparando um pacote (ping). Ele tem reflexos normais ou está sofrendo com alta latência?", "hint");
                estado.arpVisto = true;
                return;
            }

            // TRAVA 3: Tem que ver a tabela ARP antes de pingar/traceroute
            if (cmd === "ping") {
                if (!estado.arpVisto) {
                    writeLine("ERRO: Alvo desconhecido. Consulte a tabela de aparelhos na rede antes de testar a latência.", "err");
                    return;
                }
                if (p1 === ipAlvo) {
                    writeLine(`Disparando ${ipAlvo} com 32 bytes de dados:`, "sys");
                    writeLine(`Resposta de ${ipAlvo}: tempo=890ms TTL=64`);
                    writeLine(`Resposta de ${ipAlvo}: tempo=910ms TTL=64`);
                    writeLine("Estatísticas: 0% de perda. Latência Crítica.", "err");
                    writeLine("> IA_TÁTICA: O alvo está sobrecarregado enviando dados. Intercepte a agenda dele (dig) para ver qual domínio exato ele tenta contatar.", "hint");
                    estado.alvoPingado = true;
                } else if (p1) {
                    writeLine(`Resposta de ${p1}: tempo=2ms TTL=64`);
                } else {
                    writeLine("ping: uso incorreto. Especifique um [ip].", "err");
                }
                return;
            }

            if (cmd === "traceroute") {
                if (!estado.arpVisto) { writeLine("ERRO: Alvo desconhecido.", "err"); return; }
                if (p1 === ipAlvo) {
                    writeLine(`Rastreando rotas outbound de ${ipAlvo}...`, "sys");
                    writeLine(` 1  ${ipGateway} (Gateway Local)  1ms`);
                    writeLine(" 2  10.0.0.1 (ISP ISP_Node)      15ms");
                    writeLine(" 3  203.0.113.88 (Tencent AS)    240ms");
                } else {
                    writeLine("traceroute: alvo não especificado ou incorreto.", "err");
                }
                return;
            }

            // TRAVA 4: Tem que testar (ping) o alvo antes de usar DIG
            if (cmd === "dig") {
                if (!estado.alvoPingado) {
                    writeLine("ERRO: Acesso de rotina negado. Verifique o status físico (ping) do alvo antes de interceptar seu tráfego de DNS.", "err");
                    return;
                }
                if (p1 === ipAlvo) {
                    writeLine(`Interceptando DNS de ${ipAlvo}...`, "sys");
                    setTimeout(() => {
                        writeLine("QUERY DETECTADA:");
                        writeLine(";; QUESTION SECTION:");
                        writeLine(";c2-server.<span class='err'>cG9wYW5ldA==</span>.net. IN A");
                        writeLine("> IA_TÁTICA: Um texto sem sentido no meio do domínio. Criminosos disfarçam nomes usando hashes base64. Desofusque essa string.", "hint");
                        estado.dnsInterceptado = true;
                    }, 1000);
                } else {
                    writeLine("dig: alvo não especificado ou incorreto.", "err");
                }
                return;
            }

            // TRAVA 5: Tem que descobrir a hash no DIG antes de decodificar
            if (cmd === "decode") {
                if (!estado.dnsInterceptado) {
                    writeLine("ERRO: Não há string em cache para decodificar. Obtenha a assinatura DNS do alvo primeiro.", "err");
                    return;
                }
                if (p1 === "cG9wYW5ldA==" || p1 === "cg9wyw5ldA==" || p1 === "cg9wyw5lda==") {
                    writeLine("Iniciando decodificação Base64...", "sys");
                    writeLine("RESULTADO: popanet", "suc");
                    writeLine("> IA_TÁTICA: Assinatura revelada. O alvo tem nome e endereço IP. Assuma o controle total (sudo rm) para varrer essa entidade da rede.", "hint");
                    estado.hashDecodificado = true;
                } else if (p1) {
                    writeLine("decode: string inválida ou não suportada.", "err");
                } else {
                    writeLine("decode: sintaxe incorreta. Falta hash.", "err");
                }
                return;
            }

            // TRAVA FINAL: Sudo RM só funciona se tudo estiver alinhado
            if (cmd === "sudo") {
                if (!estado.hashDecodificado) {
                    writeLine("OPERAÇÃO ILEGAL: Você não coletou evidências suficientes para justificar exclusão em nível de kernel.", "err");
                    return;
                }
                
                if (p1 === "rm" && (p2 === "cg9wyw5lda==" || p2 === "cg9wyw5ldA==" || p2 === "cG9wYW5ldA==")) {
                    writeLine("sudo rm: Arquivo não encontrado. O sistema requer a string já desofuscada (texto legível).", "err");
                    return;
                }
                
                if (p1 === "rm" && p2 === "popanet" && p3 === ipAlvo) {
                    writeLine("ATENÇÃO: INICIANDO PROTOCOLO DE EXCLUSÃO.", "warn");
                    setTimeout(() => {
                        writeLine("[!] CONTRA-MEDIDA DETECTADA.", "err");
                        writeLine("[!] O MALWARE DETECTOU O ATAQUE E INICIOU A DELEÇÃO DA SUA REDE.", "err");
                        writeLine("[!] INSIRA A SENHA MESTRA DO VÍRUS PARA ABORTAR A CONTRA-MEDIDA.", "err");
                        iniciarTimerPanico();
                    }, 1000);
                } else {
                    writeLine("sudo: uso incorreto. Verifique a sintaxe e se o IP do alvo confere com a sua rede.", "err");
                }
                return;
            }

            if (cmd === "rm") {
                writeLine("rm: permissão negada. Operações de exclusão de vírus exigem permissão superior ('sudo').", "err");
                return;
            }

            writeLine(`bash: ${cmd}: comando não encontrado`, "err");
        }
    </script>
</body>
</html>
